version: 2
# Each update waits 14 days after a release is published, so a release
# that is yanked or found bad in its first days is never proposed.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
  # The fuzz crate is outside the workspace and has its own lockfile. Only
  # libfuzzer-sys is updated here: the crates it shares with the workspace
  # follow Cargo.lock (cargo xtask fuzz-lock).
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    allow:
      - dependency-name: libfuzzer-sys
    groups:
      fuzz:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
