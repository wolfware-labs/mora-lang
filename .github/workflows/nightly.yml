name: nightly

# Long-running checks that do not fit in a pull request (spec §20.1).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly compiler flags. A dated nightly and the
  # committed fuzz/Cargo.lock keep the job reproducible. Move either forward
  # on purpose, not by accident.
  FUZZ_TOOLCHAIN: nightly-2026-10-01

jobs:
  # The parser never panics and keeps every byte (§14.4), for 10 minutes of
  # generated input, starting from the parser's test files.
  fuzz-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz
      # cargo-fuzz has no --locked flag. Fetching with it fails the job when
      # fuzz/Cargo.lock no longer matches the manifest; the build below then
      # uses the lockfile as it is.
      - name: Check the lockfile
        working-directory: fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" fetch --locked
      - name: Seed the corpus
        shell: bash
        run: |
          mkdir -p fuzz/corpus/parse fuzz/seeds
          for dir in ok err; do
            for file in crates/mora-syntax/tests/parser/"$dir"/*.mr; do
              cp "$file" "fuzz/seeds/$dir-$(basename "$file")"
            done
          done
      # cargo-fuzz builds for the target its own binary was built for. The
      # prebuilt one installed above is a musl build, and the address
      # sanitizer does not work with musl's static libc, so name the target.
      - name: fuzz
        working-directory: fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run --target x86_64-unknown-linux-gnu parse corpus/parse seeds -- -max_total_time=600
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-parse-artifacts
          path: fuzz/artifacts/
          retention-days: 14

  # The fuzz crate sits outside the workspace, so ci.yml's cargo deny does not
  # see its dependencies. A job of its own, so an advisory does not stop the
  # fuzz run.
  fuzz-deny:
    runs-on: ubuntu-latest
    # Not sized from runs: checkout, the stable toolchain, a prebuilt
    # cargo-deny and the advisory database take a minute or two, and ten
    # minutes stops a hung download well before GitHub's six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny --locked --manifest-path fuzz/Cargo.toml check
