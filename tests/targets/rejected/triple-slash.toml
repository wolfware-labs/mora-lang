# A triple with `/`, which could leave `lib/rt/` as a path.
name = "triple-slash"
triple = "x86_64-unknown-linux-musl/x"
os = "linux"
arch = "x86_64"
pointer-width = 64
endian = "little"
object-format = "elf"
call-conv = "sysv64"
backend = "cranelift"
runtime = "hosted"
capabilities = ["heap", "threads", "fs", "net", "stdio", "clock", "random", "process", "env"]

[align]
i16 = 2
i32 = 4
i64 = 8
f32 = 4
f64 = 8
pointer = 8

[linker]
flavor = "ld.lld"
args = ["-static"]
