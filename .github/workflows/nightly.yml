name: nightly

# Long-running checks that do not fit in a pull request (spec §20.1).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # cargo-fuzz needs nightly compiler flags; a dated nightly keeps the job
  # reproducible. Move it forward on purpose, not by accident.
  FUZZ_TOOLCHAIN: nightly-2026-10-01

jobs:
  # The parser never panics and keeps every byte (§14.4), for 10 minutes of
  # generated input, starting from the parser's test files.
  fuzz-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-fuzz
      - name: Seed the corpus
        shell: bash
        run: |
          mkdir -p fuzz/corpus/parse fuzz/seeds
          for dir in ok err; do
            for file in crates/mora-syntax/tests/parser/"$dir"/*.mr; do
              cp "$file" "fuzz/seeds/$dir-$(basename "$file")"
            done
          done
      # cargo-fuzz builds for the target its own binary was built for. The
      # prebuilt one installed above is a musl build, and the address
      # sanitizer does not work with musl's static libc, so name the target.
      - name: fuzz
        working-directory: fuzz
        run: cargo +"$FUZZ_TOOLCHAIN" fuzz run --target x86_64-unknown-linux-gnu parse corpus/parse seeds -- -max_total_time=600
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-parse-artifacts
          path: fuzz/artifacts/
          retention-days: 14

  # A frame that only Cranelift finds too large is `MR0156`, not a panic
  # (§13.5). Its test compiles a call with 9,000 arguments, which takes
  # minutes in the test profile, so `cargo test` skips it and it runs here.
  frame-limit:
    runs-on: ubuntu-latest
    # Sized from local runs on a loaded 16-core machine: under 4 minutes to
    # build mora-codegen's tests from nothing and 1 to 4 minutes for the
    # test; a 4-core runner without a warm cache takes a few times that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # cargo passes when the name matches no test, so the step checks that
      # the test ran.
      - name: test
        shell: bash
        run: |
          cargo test --locked -p mora-codegen --lib -- --ignored --exact \
            cranelift::tests::a_frame_too_large_for_the_code_generator_is_reported_at_its_function \
            | tee test.log
          grep -q ' 1 passed;' test.log
