# cargo-mutants (spec §20.5): CI mutates the lines a pull request changes,
# and every mutant must make a test fail or stop the build. A mutant that
# survives marks code no test checks.

exclude_globs = [
    # Generated by `cargo xtask codegen`; tested through the grammar.
    "crates/mora-syntax/src/generated/**",
    # Glue around other programs, left out of coverage for the same reason:
    # the CI jobs that run `cargo xtask` exercise it end to end.
    "xtask/src/main.rs",
    "xtask/src/bench_run.rs",
    "xtask/src/runtime.rs",
]

# Mutants that survive a full run: first the ones that cannot change
# behaviour, then the ones only checks outside `cargo test` catch. Each
# entry is one whole mutant name, file:line:col included: other mutations
# at the same spot still run, and an edit that moves the code brings the
# mutant back for review instead of hiding a new one with the same name.
exclude_re = [
    # Lexer arithmetic that lands on the same result: index 0 of an
    # identifier is always an identifier character, and number errors always
    # start at offset 0.
    '^crates/mora-syntax/src/lexer/mod\.rs:481:35: replace > with >= in Lexer<.a>::code_token$',
    '^crates/mora-syntax/src/lexer/number\.rs:247:37: replace \+ with \* in separators$',
    # Popping the last event and leaving a tombstone build the same tree.
    '^crates/mora-syntax/src/parser/mod\.rs:230:21: replace \+ with - in Marker::abandon$',
    '^crates/mora-syntax/src/parser/mod\.rs:230:21: replace \+ with \* in Marker::abandon$',
    # The scan starting one token early sees the `?` itself, which it skips;
    # scanning past the end reads the end-of-file kind.
    '^crates/mora-syntax/src/parser/exprs\.rs:259:20: replace \+ with \* in conditional_follows$',
    '^crates/mora-syntax/src/parser/exprs\.rs:260:13: replace < with <= in conditional_follows$',
    # Any hash finds equal tokens; only the speed of the table depends on it.
    '^crates/mora-syntax/src/tree\.rs:472:5: replace token_hash -> u64 with 0$',
    '^crates/mora-syntax/src/tree\.rs:472:5: replace token_hash -> u64 with 1$',
    # Binding every argument when a call has one candidate, or no
    # argument waiting for a target, finds the same parameters the
    # single-candidate path uses; the guard only skips that work.
    '^crates/mora-hir/src/inference/check/call\.rs:191:56: replace && with \|\| in Check<.a>::call$',
    '^crates/mora-hir/src/inference/check/call\.rs:191:52: replace > with >= in Check<.a>::call$',
    # The placeholder compiler has no backends either way.
    '^crates/mora-testkit/src/compiler\.rs:52:9: replace <impl Compiler for Unbuilt>::backends -> &\[Backend\] with Vec::leak\(Vec::new\(\)\)$',
    '^crates/mora-testkit/src/compiler\.rs:144:9: replace <impl Compiler for FrontEnd>::backends -> &\[Backend\] with Vec::leak\(Vec::new\(\)\)$',
    # Where the lines differ, `common[i][j]` is the larger of the two
    # entries the diff compares, so comparing with it picks the same side.
    '^crates/mora-testkit/src/diff\.rs:34:87: replace \+ with \* in diff$',
    # `ALLOW` is empty, so the comparison never runs.
    '^xtask/src/target_names\.rs:344:62: replace == with != in check$',

    # Not equivalent, but checked outside `cargo test`, which is all that
    # cargo-mutants runs. CI's `runtime` job covers both:
    # - `main` is built only into the runtime library; `cargo xtask runtime
    #   --test` links a C program whose `__mora_main` returns 42 and checks
    #   the process exits with 42.
    '^crates/mora-rt/src/start\.rs:16:5: replace main -> c_int with Default::default\(\)$',
    # - Windows hosts only; the Windows legs run `cargo xtask sysroot`,
    #   which installs llvm-mingw and checks the linker it copied.
    '^xtask/src/sysroot\.rs:291:18: replace == with != in install_llvm_mingw$',
    '^xtask/src/sysroot\.rs:291:34: replace \|\| with && in install_llvm_mingw$',
]
