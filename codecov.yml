# Codecov reports both the coverage of the whole workspace and the coverage
# of the lines a pull request changes, and comments on every pull request
# that runs the coverage job: Markdown-only changes skip it (ci.yml).

coverage:
  status:
    # Total coverage, against the base commit. A little slack, so a refactor
    # that moves covered code around does not fail on rounding.
    project:
      default:
        target: auto
        threshold: 1%
    # Coverage of the lines the pull request changed.
    patch:
      default:
        target: auto
        threshold: 0%

# Generated by `cargo xtask codegen` from `mora.ungram`; its accessors are
# tested through the grammar, not one by one.
ignore:
  - "crates/mora-syntax/src/generated/**"
  # Command-line dispatch and the driver that runs cargo and C compilers for
  # each target: glue around other programs, exercised end to end by the CI
  # jobs that run `cargo xtask` rather than by unit tests.
  - "xtask/src/main.rs"
  - "xtask/src/runtime.rs"
  # The git and cargo calls of `cargo xtask bench-compare`, which is run by
  # hand before a pull request; the logic it calls is in bench_compare.rs.
  - "xtask/src/bench_run.rs"

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  # Comment even when coverage is unchanged, so a missing comment means the
  # upload failed.
  require_changes: false
