# cargo deny check: advisories, licenses, bans and sources.

[advisories]
version = 2

[licenses]
version = 2
# The list covers the licenses common in the ecosystem, not only the ones in use today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# libfuzzer-sys bundles LLVM's libFuzzer under NCSA. Only the fuzz binaries
# (fuzz/, outside the workspace) link it, so the workspace's own check never
# meets the exception and would warn about it on every run.
unused-license-exception = "allow"
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
