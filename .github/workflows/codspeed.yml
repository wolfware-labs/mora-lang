name: codspeed

# Runs the criterion benchmarks under CodSpeed's CPU simulation, which counts
# work instead of timing it, so results repeat from run to run (spec §20.6).

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed backtest earlier commits.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Authenticates the upload to CodSpeed through OIDC, so no token is stored.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: codspeed
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-codspeed
      - name: Build the benchmarks
        run: cargo codspeed build -m simulation --workspace --locked
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: cargo codspeed run
