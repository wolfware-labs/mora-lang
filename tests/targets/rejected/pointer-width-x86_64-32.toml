# x86_64-linux with 4-byte pointers: System V AMD64 passes 8-byte ones.
name = "pointer-width-x86_64-32"
triple = "x86_64-unknown-linux-musl"
os = "linux"
arch = "x86_64"
pointer-width = 32
endian = "little"
object-format = "elf"
call-conv = "sysv64"
backend = "cranelift"
runtime = "hosted"
capabilities = ["heap", "threads", "fs", "net", "stdio", "clock", "random", "process", "env"]

[align]
i16 = 2
i32 = 4
i64 = 8
f32 = 4
f64 = 8
pointer = 4

[linker]
flavor = "ld.lld"
args = ["-static"]
